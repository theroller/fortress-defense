<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fortress Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<!-- PeerJS handles the connection between the two iPads -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>

// ================================================================
// FORTRESS DEFENSE
//
// TEAM MODE:   Each player on their own iPad, connected over wifi.
//              Host creates a game and shares a 4-digit code.
//              Guest types the code to join.
//              Both see the same wall — tap to repair your side!
//
// RIVALS MODE: One iPad, two players side by side.
//              Each player defends their own fortress.
//              First fortress to fall LOSES.
// ================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

// ---- SETTINGS ----
const ROWS        = 8;
const BLOCK_W     = 60;
const BLOCK_H     = Math.min(60, Math.floor(canvas.height * 0.68 / ROWS));
const BALL_R      = 14;
const BASE_SPEED  = 180;
const REPAIR_TIME = 1.0;
const MAX_HEALTH  = 10;
const BASE_BALLS  = 4;

// ---- COLORS ----
const BG         = '#1a1a2e';
const FINN_COLOR = '#6699ff';
const FORD_COLOR = '#ff6666';
const BLOCK_OK   = '#8b8680';
const BLOCK_OUT  = '#3a2a2a';
const BLOCK_FIX  = '#a07850';
const BALL_COL   = '#2a2a2a';

// ---- LAYOUT ----
const totalWallH  = ROWS * BLOCK_H;
const wallTopY    = (canvas.height - totalWallH) / 2;
const TEAM_WALL_X = Math.round(canvas.width / 2);
const FINN_WALL_X = Math.round(canvas.width * 0.22);
const FORD_WALL_X = Math.round(canvas.width * 0.78);

function rowY(row) {
  return wallTopY + row * BLOCK_H + BLOCK_H / 2;
}
function rowAt(y) {
  return Math.max(0, Math.min(ROWS - 1, Math.floor((y - wallTopY) / BLOCK_H)));
}
function makeWall() {
  const w = [];
  for (let i = 0; i < ROWS; i++) w.push({ state: 'intact', prog: 0 });
  return w;
}

// ============================
// NETWORKING (team mode only)
// ============================
// playerRole is 'none' for rivals (single device), 'host' or 'guest' for team.
// The host runs the full game simulation and sends state to the guest ~20 times/sec.
// The guest renders whatever state it receives and sends tap events back to the host.

let playerRole  = 'none';   // 'none' | 'host' | 'guest'
let peer        = null;     // our PeerJS peer object
let conn        = null;     // the connection to the other player
let roomCode    = '';       // 4-digit code the host shows
let typedCode   = '';       // digits the guest is typing
let netError    = '';       // error message to show on screen
let pendingEvts = [];       // particle events queued to send with the next state packet
let lastSendMs  = 0;        // timestamp of last state send (for throttling)

// ---- GAME STATE ----
let gameMode  = 'team';
let gamePhase = 'menu';
// gamePhase values:
//   'menu'         — mode select
//   'team-setup'   — host vs join choice
//   'waiting-host' — host is showing the code, waiting for guest
//   'joining'      — guest typing the code
//   'connecting'   — guest is trying to connect
//   'playing'      — game running
//   'wave-clear'   — short pause between waves
//   'game-over'    — someone lost

let wave     = 1;
let cannonballs  = [];
let particles    = [];
let ballsTotal   = 0;
let ballsSent    = 0;
let spawnTimer   = 0;
let waveClearTimer = 0;
let lastTimestamp  = null;
let rivalWinner    = '';

// Team mode — one shared wall
let sharedWall   = [];
let sharedHealth = MAX_HEALTH;

// Rivals mode — two separate walls
let finnWall   = [];
let fordWall   = [];
let finnHealth = MAX_HEALTH;
let fordHealth = MAX_HEALTH;

// ---- INIT ----
function initGame(mode) {
  gameMode     = mode;
  wave         = 1;
  cannonballs  = [];
  particles    = [];
  pendingEvts  = [];
  lastTimestamp = null;
  rivalWinner   = '';

  if (mode === 'team') {
    sharedWall   = makeWall();
    sharedHealth = MAX_HEALTH;
  } else {
    finnWall   = makeWall();
    fordWall   = makeWall();
    finnHealth = MAX_HEALTH;
    fordHealth = MAX_HEALTH;
  }
  startWave();
}

// ---- WAVES ----
function startWave() {
  ballsTotal = BASE_BALLS + (wave - 1) * 2;
  ballsSent  = 0;
  spawnTimer = 0.3;
  gamePhase  = 'playing';
}

function spawnBall() {
  const speed = BASE_SPEED + (wave - 1) * 20;

  if (gameMode === 'team') {
    const fromLeft = Math.random() < 0.5;
    const row      = Math.floor(Math.random() * ROWS);
    cannonballs.push({
      x: fromLeft ? -BALL_R : canvas.width + BALL_R,
      y: rowY(row), row,
      vx: fromLeft ? speed : -speed,
      wallX: TEAM_WALL_X, fromLeft,
      target: 'shared', hasHit: false
    });
    ballsSent++;
  } else {
    // Rivals: each spawn tick fires one ball at each fortress
    const rFinn = Math.floor(Math.random() * ROWS);
    const rFord = Math.floor(Math.random() * ROWS);
    cannonballs.push({ x: -BALL_R, y: rowY(rFinn), row: rFinn, vx: speed,  wallX: FINN_WALL_X, fromLeft: true,  target: 'finn', hasHit: false });
    cannonballs.push({ x: canvas.width + BALL_R, y: rowY(rFord), row: rFord, vx: -speed, wallX: FORD_WALL_X, fromLeft: false, target: 'ford', hasHit: false });
    ballsSent++;
  }
}

// ---- REPAIR ----
function doRepair(tapX, tapY) {
  const row = rowAt(tapY);
  if (gameMode === 'team') {
    repairRow(sharedWall, row, TEAM_WALL_X);
  } else {
    if (tapX < canvas.width / 2) repairRow(finnWall, row, FINN_WALL_X);
    else                          repairRow(fordWall, row, FORD_WALL_X);
  }
}

function repairRow(wall, row, wallX) {
  const block = wall[row];
  if (block.state === 'broken') {
    block.state = 'repairing';
    block.prog  = 0;
    addParticles(wallX, rowY(row), '#c09860', 6);
  }
}

// ---- PARTICLES ----
function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 220,
      vy: (Math.random() - 0.5) * 220,
      life: 0.5, maxLife: 0.5,
      color, size: Math.random() * 8 + 3
    });
  }
  // Queue this effect to also play on the guest's screen
  if (playerRole === 'host') pendingEvts.push({ x, y, color, count });
}

// ---- COLLISION RESOLUTION ----
function resolveHit(ball) {
  const wall  = ball.target === 'shared' ? sharedWall : ball.target === 'finn' ? finnWall : fordWall;
  const block = wall[ball.row];

  if (block.state === 'intact') {
    // Wall blocks the cannonball — destroy that block
    block.state = 'broken';
    block.prog  = 0;
    addParticles(ball.wallX, rowY(ball.row), '#888', 14);
  } else {
    // Gap — fortress takes a hit
    addParticles(ball.wallX, rowY(ball.row), '#f44', 18);
    if (ball.target === 'shared') {
      sharedHealth = Math.max(0, sharedHealth - 1);
      if (sharedHealth === 0) gamePhase = 'game-over';
    } else if (ball.target === 'finn') {
      finnHealth = Math.max(0, finnHealth - 1);
      if (finnHealth === 0) { rivalWinner = 'ford'; gamePhase = 'game-over'; }
    } else {
      fordHealth = Math.max(0, fordHealth - 1);
      if (fordHealth === 0) { rivalWinner = 'finn'; gamePhase = 'game-over'; }
    }
  }
}

// ============================
// UPDATE — only the host runs this.
// The guest skips update() and just renders received state.
// ============================
function update(dt) {
  if (!['playing', 'wave-clear'].includes(gamePhase)) return;

  // Advance block repairs
  const walls = gameMode === 'team' ? [sharedWall] : [finnWall, fordWall];
  for (const wall of walls) {
    for (const block of wall) {
      if (block.state === 'repairing') {
        block.prog += dt / REPAIR_TIME;
        if (block.prog >= 1) { block.state = 'intact'; block.prog = 1; }
      }
    }
  }

  // Spawn cannonballs
  if (ballsSent < ballsTotal) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBall();
      spawnTimer = Math.max(0.4, 1.3 - (wave - 1) * 0.1);
    }
  }

  // Move cannonballs and check for wall hits
  for (let i = cannonballs.length - 1; i >= 0; i--) {
    const ball = cannonballs[i];
    ball.x += ball.vx * dt;

    if (!ball.hasHit) {
      const hitZone = ball.fromLeft ? ball.x >= ball.wallX - BLOCK_W / 2
                                    : ball.x <= ball.wallX + BLOCK_W / 2;
      if (hitZone) {
        ball.hasHit = true;
        resolveHit(ball);
        cannonballs.splice(i, 1);
        continue;
      }
    }
    if (ball.x < -80 || ball.x > canvas.width + 80) cannonballs.splice(i, 1);
  }

  // Wave finished?
  if (gamePhase === 'playing' && ballsSent >= ballsTotal && cannonballs.length === 0) {
    wave++;
    gamePhase = 'wave-clear';
    waveClearTimer = 2.5;
  }
  if (gamePhase === 'wave-clear') {
    waveClearTimer -= dt;
    if (waveClearTimer <= 0) startWave();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 280 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Guest: move received cannonballs smoothly between state updates
function updateGuest(dt) {
  for (const ball of cannonballs) ball.x += ball.vx * dt;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 280 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

let guestReady = false;  // true once the guest receives its first state packet

// Guest applies the state packet the host sent
function applyHostState(data) {
  guestReady   = true;
  sharedWall   = data.wall;
  sharedHealth = data.health;
  wave         = data.wave;
  gamePhase    = data.phase;
  // Rebuild cannonballs with velocity so the guest can animate them smoothly
  cannonballs  = (data.balls || []).map(b => ({
    ...b, wallX: TEAM_WALL_X, target: 'shared', hasHit: false
  }));
  // Play particle effects that the host sent
  for (const e of (data.events || [])) addParticles(e.x, e.y, e.color, e.count);
}

// ============================
// NETWORKING — PeerJS setup
// ============================

function startHost() {
  netError   = '';
  playerRole = 'host';
  // Generate a 4-digit room code and use it as the PeerJS peer ID
  const digits = Math.floor(1000 + Math.random() * 9000).toString();
  roomCode   = digits;
  gamePhase  = 'waiting-host';

  peer = new Peer('fd' + digits);

  peer.on('error', function(err) {
    // If that code is already taken by another game, try a new code
    if (err.type === 'unavailable-id') { peer.destroy(); peer = null; startHost(); return; }
    netError  = 'Network error. Check wifi and try again.';
    gamePhase = 'team-setup';
  });

  peer.on('connection', function(c) {
    if (conn) return;  // already have a guest — ignore extra connections
    conn = c;
    conn.on('open', function() {
      initGame('team');
    });
    conn.on('data', function(data) {
      // Guest sent a repair tap — apply it on the host's simulation
      if (data.type === 'repair') repairRow(sharedWall, data.row, TEAM_WALL_X);
    });
    conn.on('close', function() {
      if (gamePhase !== 'menu') { netError = 'Partner disconnected.'; backToMenu(); }
    });
  });
}

function startJoin() {
  playerRole = 'guest';
  typedCode  = '';
  netError   = '';
  gamePhase  = 'joining';
}

function submitCode() {
  if (typedCode.length !== 4) return;
  netError  = '';
  gamePhase = 'connecting';

  peer = new Peer();
  peer.on('open', function() {
    conn = peer.connect('fd' + typedCode, { serialization: 'json' });
    conn.on('open', function() {
      gamePhase = 'playing';  // waiting for host's first state packet
    });
    conn.on('data', function(data) {
      if (data.type === 'state') applyHostState(data);
    });
    conn.on('close', function() {
      if (gamePhase !== 'menu') { netError = 'Lost connection to host.'; backToMenu(); }
    });
    conn.on('error', function() {
      netError  = "Couldn't connect. Check the code.";
      gamePhase = 'joining';
      typedCode = '';
    });
  });
  peer.on('error', function(err) {
    netError  = err.type === 'peer-unavailable' ? 'Game not found. Check the code.' : 'Network error. Try again.';
    gamePhase = 'joining';
    typedCode = '';
    if (peer) { peer.destroy(); peer = null; }
  });
}

function backToMenu() {
  if (peer) { peer.destroy(); peer = null; }
  conn       = null;
  playerRole = 'none';
  roomCode   = '';
  typedCode  = '';
  gamePhase  = 'menu';
}

// ============================
// DRAW HELPERS
// ============================

function drawBlock(block, bx, by) {
  if (block.state === 'intact') {
    ctx.fillStyle = BLOCK_OK;
    ctx.fillRect(bx, by, BLOCK_W, BLOCK_H);
    ctx.strokeStyle = '#5a5550'; ctx.lineWidth = 2;
    ctx.strokeRect(bx + 1, by + 1, BLOCK_W - 2, BLOCK_H - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx + 3, by + 3, BLOCK_W - 6, 7);

  } else if (block.state === 'broken') {
    ctx.fillStyle = BLOCK_OUT;
    ctx.fillRect(bx, by, BLOCK_W, BLOCK_H);
    ctx.strokeStyle = '#883333'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx + 6, by + 6);        ctx.lineTo(bx + BLOCK_W - 6, by + BLOCK_H - 6);
    ctx.moveTo(bx + BLOCK_W - 6, by + 6); ctx.lineTo(bx + 6, by + BLOCK_H - 6);
    ctx.stroke();

  } else {
    ctx.fillStyle = BLOCK_OUT;
    ctx.fillRect(bx, by, BLOCK_W, BLOCK_H);
    const fillH = BLOCK_H * block.prog;
    ctx.fillStyle = BLOCK_FIX;
    ctx.fillRect(bx, by + BLOCK_H - fillH, BLOCK_W, fillH);
    ctx.strokeStyle = '#c09860'; ctx.lineWidth = 2;
    ctx.strokeRect(bx + 1, by + 1, BLOCK_W - 2, BLOCK_H - 2);
  }
}

function drawWall(wall, wallX) {
  for (let i = 0; i < ROWS; i++) {
    if (!wall[i]) continue;  // skip if state not yet received from host
    drawBlock(wall[i], wallX - BLOCK_W / 2, wallTopY + i * BLOCK_H);
  }
}

function drawBalls() {
  for (const ball of cannonballs) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(ball.x + 4, ball.y + 5, BALL_R, BALL_R * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = BALL_COL;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(ball.x - 4, ball.y - 4, BALL_R * 0.38, 0, Math.PI * 2); ctx.fill();
  }
}

function drawParticlesFn() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHealthBar(cx, y, health, label, color) {
  const bw = 200, bh = 26, bx = cx - bw / 2;
  const pct = health / MAX_HEALTH;
  ctx.fillStyle = '#333'; ctx.fillRect(bx, y, bw, bh);
  ctx.fillStyle = pct > 0.6 ? '#44bb44' : pct > 0.3 ? '#bbbb44' : '#bb4444';
  ctx.fillRect(bx, y, bw * pct, bh);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 2; ctx.strokeRect(bx, y, bw, bh);
  ctx.fillStyle = color; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText(label, cx, y - 6);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================
// DRAW SCREENS
// ============================

function drawMenu() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 48px Arial'; ctx.textAlign = 'center';
  ctx.fillText('FORTRESS DEFENSE', canvas.width / 2, canvas.height * 0.22);
  ctx.fillStyle = '#aaa'; ctx.font = '22px Arial';
  ctx.fillText('Pick a mode!', canvas.width / 2, canvas.height * 0.33);

  const btnW = Math.min(260, canvas.width * 0.37);
  const btnH = 145;
  const gap  = 30;
  const btnY = canvas.height * 0.42;
  const teamX = canvas.width / 2 - btnW - gap / 2;
  const rivX  = canvas.width / 2 + gap / 2;

  ctx.fillStyle = 'rgba(60,100,200,0.3)'; ctx.strokeStyle = FINN_COLOR; ctx.lineWidth = 3;
  roundRect(teamX, btnY, btnW, btnH, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
  ctx.fillText('🤝 TEAM', teamX + btnW / 2, btnY + 48);
  ctx.fillStyle = '#aaa'; ctx.font = '16px Arial';
  ctx.fillText('Two iPads, one fortress', teamX + btnW / 2, btnY + 80);
  ctx.fillText('survive together!', teamX + btnW / 2, btnY + 104);

  ctx.fillStyle = 'rgba(180,60,60,0.3)'; ctx.strokeStyle = '#ff9944'; ctx.lineWidth = 3;
  roundRect(rivX, btnY, btnW, btnH, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial';
  ctx.fillText('⚔️ RIVALS', rivX + btnW / 2, btnY + 48);
  ctx.fillStyle = '#aaa'; ctx.font = '16px Arial';
  ctx.fillText('One iPad, two players —', rivX + btnW / 2, btnY + 80);
  ctx.fillText('last fortress standing!', rivX + btnW / 2, btnY + 104);

  canvas._teamBtn   = { x: teamX, y: btnY, w: btnW, h: btnH };
  canvas._rivalsBtn = { x: rivX,  y: btnY, w: btnW, h: btnH };
}

function drawTeamSetup() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
  ctx.fillText('TEAM MODE', canvas.width / 2, canvas.height * 0.18);
  ctx.fillStyle = '#aaa'; ctx.font = '20px Arial';
  ctx.fillText('Each player picks a role on their own iPad', canvas.width / 2, canvas.height * 0.28);

  if (netError) { ctx.fillStyle = '#ff6666'; ctx.font = '18px Arial'; ctx.fillText(netError, canvas.width / 2, canvas.height * 0.36); }

  const btnW = 220, btnH = 120, gap = 40;
  const btnY = canvas.height * 0.42;
  const hostX = canvas.width / 2 - btnW - gap / 2;
  const joinX = canvas.width / 2 + gap / 2;

  ctx.fillStyle = 'rgba(60,200,100,0.25)'; ctx.strokeStyle = '#44cc77'; ctx.lineWidth = 3;
  roundRect(hostX, btnY, btnW, btnH, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
  ctx.fillText('🏰 HOST', hostX + btnW / 2, btnY + 42);
  ctx.fillStyle = '#aaa'; ctx.font = '15px Arial';
  ctx.fillText('Start the game,', hostX + btnW / 2, btnY + 70);
  ctx.fillText('share a code', hostX + btnW / 2, btnY + 90);

  ctx.fillStyle = 'rgba(200,160,60,0.25)'; ctx.strokeStyle = '#ccaa44'; ctx.lineWidth = 3;
  roundRect(joinX, btnY, btnW, btnH, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
  ctx.fillText('🚪 JOIN', joinX + btnW / 2, btnY + 42);
  ctx.fillStyle = '#aaa'; ctx.font = '15px Arial';
  ctx.fillText("Enter the host's", joinX + btnW / 2, btnY + 70);
  ctx.fillText('4-digit code', joinX + btnW / 2, btnY + 90);

  const backY = canvas.height * 0.78;
  ctx.fillStyle = '#555'; ctx.font = '20px Arial'; ctx.fillText('← Back', canvas.width / 2, backY);
  canvas._hostBtn  = { x: hostX, y: btnY, w: btnW, h: btnH };
  canvas._joinBtn  = { x: joinX, y: btnY, w: btnW, h: btnH };
  canvas._backArea = { x: canvas.width / 2 - 80, y: backY - 30, w: 160, h: 44 };
}

function drawWaitingHost() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
  ctx.fillText('Share this code with your partner:', canvas.width / 2, canvas.height * 0.28);
  // Big yellow code
  ctx.fillStyle = '#ffff44'; ctx.font = 'bold 120px Arial';
  ctx.fillText(roomCode, canvas.width / 2, canvas.height * 0.54);
  ctx.fillStyle = '#aaa'; ctx.font = '22px Arial';
  ctx.fillText('Waiting for them to join' + '.'.repeat(1 + Math.floor(Date.now() / 500) % 3), canvas.width / 2, canvas.height * 0.67);

  const backY = canvas.height * 0.82;
  ctx.fillStyle = '#555'; ctx.font = '20px Arial'; ctx.fillText('← Cancel', canvas.width / 2, backY);
  canvas._backArea = { x: canvas.width / 2 - 80, y: backY - 30, w: 160, h: 44 };
}

function drawJoining() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
  ctx.fillText("Enter the host's code:", canvas.width / 2, canvas.height * 0.13);
  if (netError) { ctx.fillStyle = '#ff6666'; ctx.font = '18px Arial'; ctx.fillText(netError, canvas.width / 2, canvas.height * 0.2); }

  // 4 digit slots
  const slotW = 72, slotH = 88, slotGap = 14;
  const totalW = 4 * slotW + 3 * slotGap;
  const slotX  = canvas.width / 2 - totalW / 2;
  const slotY  = canvas.height * 0.24;
  for (let i = 0; i < 4; i++) {
    const sx = slotX + i * (slotW + slotGap);
    ctx.fillStyle = '#333'; ctx.fillRect(sx, slotY, slotW, slotH);
    ctx.strokeStyle = i < typedCode.length ? '#ffff44' : '#555';
    ctx.lineWidth = 3; ctx.strokeRect(sx, slotY, slotW, slotH);
    if (i < typedCode.length) {
      ctx.fillStyle = '#ffff44'; ctx.font = 'bold 54px Arial';
      ctx.fillText(typedCode[i], sx + slotW / 2, slotY + 65);
    }
  }

  // Number pad
  const keyW = 82, keyH = 72, keyGap = 12;
  const padX = canvas.width / 2 - (3 * keyW + 2 * keyGap) / 2;
  const padY = canvas.height * 0.45;
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','GO'];
  canvas._numPad = [];

  for (let i = 0; i < 12; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    const kx = padX + col * (keyW + keyGap);
    const ky = padY + row * (keyH + keyGap);
    const label    = keys[i];
    const isGo     = label === 'GO';
    const disabled = isGo && typedCode.length !== 4;

    ctx.fillStyle = isGo ? (disabled ? '#333' : '#335533') : '#223';
    roundRect(kx, ky, keyW, keyH, 10); ctx.fill();
    ctx.strokeStyle = isGo ? (disabled ? '#444' : '#66cc88') : '#446';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = disabled ? '#555' : '#fff';
    ctx.font = isGo ? 'bold 22px Arial' : 'bold 32px Arial';
    ctx.fillText(label, kx + keyW / 2, ky + keyH / 2 + 11);
    canvas._numPad.push({ x: kx, y: ky, w: keyW, h: keyH, label, disabled });
  }

  const backY = canvas.height * 0.93;
  ctx.fillStyle = '#555'; ctx.font = '20px Arial'; ctx.fillText('← Cancel', canvas.width / 2, backY);
  canvas._backArea = { x: canvas.width / 2 - 80, y: backY - 30, w: 160, h: 44 };
}

function drawConnecting() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center';
  ctx.fillText('Connecting' + '.'.repeat(1 + Math.floor(Date.now() / 400) % 3), canvas.width / 2, canvas.height / 2);
}

function drawGame() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle zone tints
  ctx.fillStyle = 'rgba(60,100,200,0.1)';  ctx.fillRect(0, 0, canvas.width / 2, canvas.height);
  ctx.fillStyle = 'rgba(200,60,60,0.1)';   ctx.fillRect(canvas.width / 2, 0, canvas.width / 2, canvas.height);

  // Guest shows a waiting screen until the first state packet arrives from the host
  if (playerRole === 'guest' && !guestReady) {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Waiting for game' + '.'.repeat(1 + Math.floor(Date.now() / 500) % 3), canvas.width / 2, canvas.height / 2);
    return;
  }

  if (gameMode === 'team') {
    drawWall(sharedWall, TEAM_WALL_X);
    if (sharedWall.some(b => b.state === 'broken')) {
      ctx.fillStyle = 'rgba(255,200,80,0.9)'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
      ctx.fillText('TAP TO REPAIR', TEAM_WALL_X, wallTopY - 12);
    }
    ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = FINN_COLOR; ctx.fillText('FINN', canvas.width * 0.25, 44);
    ctx.fillStyle = FORD_COLOR; ctx.fillText('FORD', canvas.width * 0.75, 44);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.fillText('WAVE ' + wave, TEAM_WALL_X, 44);
    drawHealthBar(canvas.width / 2, canvas.height - 55, sharedHealth, 'FORTRESS HEALTH', '#fff');

  } else {
    drawWall(finnWall, FINN_WALL_X);
    drawWall(fordWall, FORD_WALL_X);
    if (finnWall.some(b => b.state === 'broken')) {
      ctx.fillStyle = 'rgba(255,200,80,0.9)'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
      ctx.fillText('TAP TO REPAIR', FINN_WALL_X, wallTopY - 12);
    }
    if (fordWall.some(b => b.state === 'broken')) {
      ctx.fillStyle = 'rgba(255,200,80,0.9)'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
      ctx.fillText('TAP TO REPAIR', FORD_WALL_X, wallTopY - 12);
    }
    ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
    ctx.fillStyle = FINN_COLOR; ctx.fillText('FINN', FINN_WALL_X, 44);
    ctx.fillStyle = FORD_COLOR; ctx.fillText('FORD', FORD_WALL_X, 44);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.fillText('WAVE ' + wave, canvas.width / 2, 44);
    drawHealthBar(FINN_WALL_X, canvas.height - 55, finnHealth, "FINN'S FORTRESS", FINN_COLOR);
    drawHealthBar(FORD_WALL_X, canvas.height - 55, fordHealth, "FORD'S FORTRESS", FORD_COLOR);
  }

  drawBalls();
  drawParticlesFn();

  if (gamePhase === 'wave-clear') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(canvas.width / 2 - 170, canvas.height / 2 - 55, 340, 110);
    ctx.fillStyle = '#ffff44'; ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
    ctx.fillText('WAVE CLEAR!', canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = '#fff'; ctx.font = '22px Arial';
    ctx.fillText('Wave ' + wave + ' incoming...', canvas.width / 2, canvas.height / 2 + 42);
  }

  if (gamePhase === 'game-over') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    if (gameMode === 'team') {
      ctx.fillStyle = '#ff4444'; ctx.font = 'bold 52px Arial';
      ctx.fillText('FORTRESS FALLEN!', canvas.width / 2, canvas.height / 2 - 60);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
      const wv = wave - 1;
      ctx.fillText('Survived ' + wv + ' wave' + (wv === 1 ? '' : 's') + '!', canvas.width / 2, canvas.height / 2);
    } else {
      const wc = rivalWinner === 'finn' ? FINN_COLOR : FORD_COLOR;
      const wn = rivalWinner === 'finn' ? 'FINN' : 'FORD';
      ctx.fillStyle = wc; ctx.font = 'bold 52px Arial';
      ctx.fillText(wn + ' WINS!', canvas.width / 2, canvas.height / 2 - 60);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial';
      const wv = wave - 1;
      ctx.fillText('Survived ' + wv + ' wave' + (wv === 1 ? '' : 's'), canvas.width / 2, canvas.height / 2);
    }
    ctx.fillStyle = '#aaa'; ctx.font = '22px Arial';
    ctx.fillText('Tap anywhere to go back', canvas.width / 2, canvas.height / 2 + 55);
  }
}

// ---- MAIN DRAW ----
function draw() {
  if      (gamePhase === 'menu')         drawMenu();
  else if (gamePhase === 'team-setup')   drawTeamSetup();
  else if (gamePhase === 'waiting-host') drawWaitingHost();
  else if (gamePhase === 'joining')      drawJoining();
  else if (gamePhase === 'connecting')   drawConnecting();
  else                                   drawGame();
}

// ============================
// INPUT
// ============================
function hit(tx, ty, rect) {
  return rect && tx >= rect.x && tx <= rect.x + rect.w && ty >= rect.y && ty <= rect.y + rect.h;
}

function handleTap(tx, ty) {
  if (gamePhase === 'menu') {
    if (hit(tx, ty, canvas._teamBtn))   { netError = ''; gamePhase = 'team-setup'; }
    if (hit(tx, ty, canvas._rivalsBtn)) initGame('rivals');

  } else if (gamePhase === 'team-setup') {
    if (hit(tx, ty, canvas._hostBtn))  startHost();
    if (hit(tx, ty, canvas._joinBtn))  startJoin();
    if (hit(tx, ty, canvas._backArea)) { netError = ''; gamePhase = 'menu'; }

  } else if (gamePhase === 'waiting-host') {
    if (hit(tx, ty, canvas._backArea)) backToMenu();

  } else if (gamePhase === 'joining') {
    if (hit(tx, ty, canvas._backArea)) { backToMenu(); return; }
    for (const key of (canvas._numPad || [])) {
      if (!hit(tx, ty, key)) continue;
      if (key.label === '⌫')       typedCode = typedCode.slice(0, -1);
      else if (key.label === 'GO') submitCode();
      else if (typedCode.length < 4) typedCode += key.label;
    }

  } else if (gamePhase === 'connecting') {
    // do nothing — waiting for network

  } else if (gamePhase === 'game-over') {
    backToMenu();

  } else {
    // Playing or wave-clear
    if (playerRole === 'guest') {
      // Guest sends its tap to the host rather than applying it locally
      const row = rowAt(ty);
      if (conn && conn.open) conn.send({ type: 'repair', row });
    } else {
      doRepair(tx, ty);
    }
  }
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    handleTap(t.clientX - r.left, t.clientY - r.top);
  }
}, { passive: false });

canvas.addEventListener('click', function(e) {
  const r = canvas.getBoundingClientRect();
  handleTap(e.clientX - r.left, e.clientY - r.top);
});

// ============================
// GAME LOOP
// ============================
function gameLoop(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
  lastTimestamp = timestamp;

  if (playerRole === 'guest') {
    // Guest doesn't simulate — just interpolates ball positions for smooth animation
    updateGuest(dt);
  } else {
    // Host (or single-device rivals) runs the full simulation
    update(dt);
  }

  // Host sends state to guest at ~20fps
  // Use try/catch instead of checking conn.open — PeerJS 1.5.x can lag on updating that flag
  if (playerRole === 'host' && conn) {
    const now = Date.now();
    if (now - lastSendMs >= 50) {
      lastSendMs = now;
      try {
        conn.send({
          type:   'state',
          wall:   sharedWall,
          health: sharedHealth,
          wave,
          phase:  gamePhase,
          balls:  cannonballs.map(b => ({ x: b.x, y: b.y, row: b.row, fromLeft: b.fromLeft, vx: b.vx })),
          events: pendingEvts
        });
        pendingEvts = [];
      } catch(e) { /* connection not ready yet — will retry next frame */ }
    }
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ---- GO ----
gamePhase = 'menu';
requestAnimationFrame(gameLoop);

</script>
