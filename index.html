<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fortress Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>

// ================================================================
// FORTRESS DEFENSE
//
// TEAM MODE:   Finn (left) + Ford (right) share one wall.
//              Cannonballs attack from both sides. Survive together.
//
// RIVALS MODE: Finn has his own fortress (left side).
//              Ford has his own fortress (right side).
//              Cannonballs attack each fortress independently.
//              First fortress to fall LOSES.
// ================================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ---- SETTINGS ----
const NUMBER_OF_ROWS   = 8;
const BLOCK_WIDTH      = 50;
const BLOCK_HEIGHT     = Math.min(60, Math.floor(canvas.height * 0.7 / NUMBER_OF_ROWS));
const CANNONBALL_R     = 14;
const BASE_SPEED       = 180;
const REPAIR_TIME      = 1.0;
const MAX_HEALTH       = 10;
const BASE_BALLS       = 4;

// ---- COLORS ----
const BG              = '#1a1a2e';
const FINN_ZONE       = 'rgba(60, 100, 200, 0.12)';
const FORD_ZONE       = 'rgba(200, 60, 60, 0.12)';
const BLOCK_INTACT    = '#8b8680';
const BLOCK_BROKEN    = '#3a2a2a';
const BLOCK_REPAIRING = '#a07850';
const BALL_COLOR      = '#2a2a2a';
const FINN_COLOR      = '#6699ff';
const FORD_COLOR      = '#ff6666';

// ---- LAYOUT HELPERS ----
const totalWallH = NUMBER_OF_ROWS * BLOCK_HEIGHT;
const wallTopY   = (canvas.height - totalWallH) / 2;

function rowCenterY(row) {
  return wallTopY + row * BLOCK_HEIGHT + BLOCK_HEIGHT / 2;
}
function rowFromY(y) {
  return Math.max(0, Math.min(NUMBER_OF_ROWS - 1, Math.floor((y - wallTopY) / BLOCK_HEIGHT)));
}
function makeWall() {
  const wall = [];
  for (let i = 0; i < NUMBER_OF_ROWS; i++) {
    wall.push({ state: 'intact', repairProgress: 0 });
  }
  return wall;
}

// ---- GAME STATE ----
let gameMode  = 'team';   // 'team' or 'rivals'
let gamePhase = 'menu';   // 'menu', 'playing', 'wave-clear', 'game-over'

// Shared across modes
let wave         = 1;
let cannonballs  = [];
let particles    = [];
let ballsThisWave  = 0;
let ballsSpawned   = 0;
let spawnTimer     = 0;
let waveClearTimer = 0;
let lastTimestamp  = null;

// Team mode
let sharedWall   = [];
let sharedHealth = MAX_HEALTH;
const TEAM_WALL_X = canvas.width / 2;

// Rivals mode
let finnWall   = [];
let fordWall   = [];
let finnHealth = MAX_HEALTH;
let fordHealth = MAX_HEALTH;
let rivalWinner = '';  // 'finn' or 'ford'

// Rivals wall positions — each fortress is 22% from its respective edge
const FINN_WALL_X = Math.round(canvas.width * 0.22);
const FORD_WALL_X = Math.round(canvas.width * 0.78);

// ---- INIT ----
function initGame(mode) {
  gameMode  = mode;
  wave      = 1;
  cannonballs  = [];
  particles    = [];
  lastTimestamp = null;
  rivalWinner   = '';

  if (mode === 'team') {
    sharedWall   = makeWall();
    sharedHealth = MAX_HEALTH;
  } else {
    finnWall   = makeWall();
    fordWall   = makeWall();
    finnHealth = MAX_HEALTH;
    fordHealth = MAX_HEALTH;
  }

  startWave();
}

// ---- WAVES ----
function startWave() {
  ballsThisWave = BASE_BALLS + (wave - 1) * 2;
  ballsSpawned  = 0;
  spawnTimer    = 0.3;
  gamePhase     = 'playing';
  console.log('Wave', wave, '—', ballsThisWave, 'cannonballs');
}

function spawnCannonball() {
  const speed = BASE_SPEED + (wave - 1) * 20;

  if (gameMode === 'team') {
    // Team: attack from left OR right, target the shared center wall
    const fromLeft  = Math.random() < 0.5;
    const targetRow = Math.floor(Math.random() * NUMBER_OF_ROWS);
    cannonballs.push({
      x: fromLeft ? -CANNONBALL_R : canvas.width + CANNONBALL_R,
      y: rowCenterY(targetRow),
      vx: fromLeft ? speed : -speed,
      row: targetRow,
      wallX: TEAM_WALL_X,
      fromLeft: fromLeft,
      target: 'shared',
      hasHit: false
    });
  } else {
    // Rivals: one ball attacks Finn's wall (from the left edge),
    //         one ball attacks Ford's wall (from the right edge)
    const finnRow = Math.floor(Math.random() * NUMBER_OF_ROWS);
    const fordRow = Math.floor(Math.random() * NUMBER_OF_ROWS);

    // Cannonball flying RIGHT toward Finn's wall (from off the left edge)
    cannonballs.push({
      x: -CANNONBALL_R,
      y: rowCenterY(finnRow),
      vx: speed,
      row: finnRow,
      wallX: FINN_WALL_X,
      fromLeft: true,
      target: 'finn',
      hasHit: false
    });

    // Cannonball flying LEFT toward Ford's wall (from off the right edge)
    cannonballs.push({
      x: canvas.width + CANNONBALL_R,
      y: rowCenterY(fordRow),
      vx: -speed,
      row: fordRow,
      wallX: FORD_WALL_X,
      fromLeft: false,
      target: 'ford',
      hasHit: false
    });

    // Rivals spawns 2 balls per "turn" — count as one spawn event
  }

  ballsSpawned++;
}

// ---- REPAIR ----
function tryRepair(tapX, tapY) {
  const row = rowFromY(tapY);

  if (gameMode === 'team') {
    // Either player can repair any block
    repairBlock(sharedWall, row);
  } else {
    // Each player can only repair their own wall
    if (tapX < canvas.width / 2) {
      repairBlock(finnWall, row);
    } else {
      repairBlock(fordWall, row);
    }
  }
}

function repairBlock(wall, row) {
  const block = wall[row];
  if (block.state === 'broken') {
    block.state = 'repairing';
    block.repairProgress = 0;
    console.log('Repairing row', row);
  }
}

// ---- PARTICLES ----
function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 220,
      vy: (Math.random() - 0.5) * 220,
      life: 0.5, maxLife: 0.5,
      color,
      size: Math.random() * 8 + 3
    });
  }
}

// ---- HIT LOGIC ----
function resolveHit(ball) {
  let wall, healthTarget;

  if (ball.target === 'shared') {
    wall = sharedWall;
  } else if (ball.target === 'finn') {
    wall = finnWall;
  } else {
    wall = fordWall;
  }

  const block = wall[ball.row];
  const hitX  = ball.wallX;

  if (block.state === 'intact') {
    // Wall stops it — block destroyed
    block.state = 'broken';
    block.repairProgress = 0;
    addParticles(hitX, rowCenterY(ball.row), '#888888', 14);
    console.log('Block destroyed at row', ball.row, 'on', ball.target, 'wall');
  } else {
    // Gap — fortress takes damage
    addParticles(hitX, rowCenterY(ball.row), '#ff4444', 18);

    if (ball.target === 'shared') {
      sharedHealth = Math.max(0, sharedHealth - 1);
      console.log('Shared health:', sharedHealth);
      if (sharedHealth === 0) gamePhase = 'game-over';
    } else if (ball.target === 'finn') {
      finnHealth = Math.max(0, finnHealth - 1);
      console.log('Finn health:', finnHealth);
      if (finnHealth === 0) { rivalWinner = 'ford'; gamePhase = 'game-over'; }
    } else {
      fordHealth = Math.max(0, fordHealth - 1);
      console.log('Ford health:', fordHealth);
      if (fordHealth === 0) { rivalWinner = 'finn'; gamePhase = 'game-over'; }
    }
  }
}

// ---- UPDATE ----
function update(dt) {
  if (gamePhase === 'game-over' || gamePhase === 'menu') return;

  // Advance repairs
  function updateWallRepairs(wall) {
    for (let i = 0; i < NUMBER_OF_ROWS; i++) {
      const block = wall[i];
      if (block.state === 'repairing') {
        block.repairProgress += dt / REPAIR_TIME;
        if (block.repairProgress >= 1) {
          block.state = 'intact';
          block.repairProgress = 1;
        }
      }
    }
  }
  if (gameMode === 'team') {
    updateWallRepairs(sharedWall);
  } else {
    updateWallRepairs(finnWall);
    updateWallRepairs(fordWall);
  }

  // Spawn cannonballs
  if (ballsSpawned < ballsThisWave) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnCannonball();
      spawnTimer = Math.max(0.4, 1.3 - (wave - 1) * 0.1);
    }
  }

  // Move cannonballs and check collisions
  for (let i = cannonballs.length - 1; i >= 0; i--) {
    const ball = cannonballs[i];
    ball.x += ball.vx * dt;

    if (!ball.hasHit) {
      const reachedWall = ball.fromLeft
        ? ball.x >= ball.wallX - BLOCK_WIDTH / 2
        : ball.x <= ball.wallX + BLOCK_WIDTH / 2;

      if (reachedWall) {
        ball.hasHit = true;
        resolveHit(ball);
        cannonballs.splice(i, 1);
        continue;
      }
    }

    if (ball.x < -80 || ball.x > canvas.width + 80) {
      cannonballs.splice(i, 1);
    }
  }

  // Check wave completion
  if (gamePhase === 'playing' && ballsSpawned >= ballsThisWave && cannonballs.length === 0) {
    wave++;
    gamePhase = 'wave-clear';
    waveClearTimer = 2.5;
  }
  if (gamePhase === 'wave-clear') {
    waveClearTimer -= dt;
    if (waveClearTimer <= 0) startWave();
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 280 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ---- DRAW HELPERS ----
function drawWall(wall, wallX) {
  for (let i = 0; i < NUMBER_OF_ROWS; i++) {
    const block = wall[i];
    const bx = wallX - BLOCK_WIDTH / 2;
    const by = wallTopY + i * BLOCK_HEIGHT;

    if (block.state === 'intact') {
      ctx.fillStyle = BLOCK_INTACT;
      ctx.fillRect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);
      ctx.strokeStyle = '#5a5550';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + 1, by + 1, BLOCK_WIDTH - 2, BLOCK_HEIGHT - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(bx + 3, by + 3, BLOCK_WIDTH - 6, 7);

    } else if (block.state === 'broken') {
      ctx.fillStyle = BLOCK_BROKEN;
      ctx.fillRect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);
      ctx.strokeStyle = '#883333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx + 6, by + 6);
      ctx.lineTo(bx + BLOCK_WIDTH - 6, by + BLOCK_HEIGHT - 6);
      ctx.moveTo(bx + BLOCK_WIDTH - 6, by + 6);
      ctx.lineTo(bx + 6, by + BLOCK_HEIGHT - 6);
      ctx.stroke();

    } else if (block.state === 'repairing') {
      ctx.fillStyle = BLOCK_BROKEN;
      ctx.fillRect(bx, by, BLOCK_WIDTH, BLOCK_HEIGHT);
      const fillH = BLOCK_HEIGHT * block.repairProgress;
      ctx.fillStyle = BLOCK_REPAIRING;
      ctx.fillRect(bx, by + BLOCK_HEIGHT - fillH, BLOCK_WIDTH, fillH);
      ctx.strokeStyle = '#c09860';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx + 1, by + 1, BLOCK_WIDTH - 2, BLOCK_HEIGHT - 2);
    }
  }
}

function drawCannonballs() {
  for (const ball of cannonballs) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(ball.x + 4, ball.y + 5, CANNONBALL_R, CANNONBALL_R * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = BALL_COLOR;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, CANNONBALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(ball.x - 4, ball.y - 4, CANNONBALL_R * 0.38, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHealthBar(x, y, health, label, color) {
  const barW = 180;
  const barH = 24;
  const bx   = x - barW / 2;
  const pct  = health / MAX_HEALTH;

  ctx.fillStyle = '#333';
  ctx.fillRect(bx, y, barW, barH);
  ctx.fillStyle = pct > 0.6 ? '#44bb44' : pct > 0.3 ? '#bbbb44' : '#bb4444';
  ctx.fillRect(bx, y, barW * pct, barH);
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, y, barW, barH);

  ctx.fillStyle = color;
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y - 6);
}

function drawRepairHint(wall, wallX) {
  if (!wall.some(b => b.state === 'broken')) return;
  ctx.font = 'bold 15px Arial';
  ctx.fillStyle = 'rgba(255, 200, 80, 0.9)';
  ctx.textAlign = 'center';
  ctx.fillText('TAP TO REPAIR', wallX, wallTopY - 10);
}

// ---- DRAW MENU ----
function drawMenu() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('FORTRESS DEFENSE', canvas.width / 2, canvas.height * 0.22);

  ctx.fillStyle = '#aaaaaa';
  ctx.font = '22px Arial';
  ctx.fillText('Pick a mode to start!', canvas.width / 2, canvas.height * 0.33);

  // Team button (left)
  const btnW = Math.min(280, canvas.width * 0.38);
  const btnH = 140;
  const gap  = 30;
  const btnY = canvas.height * 0.42;
  const teamX = canvas.width / 2 - btnW - gap / 2;
  const rivX  = canvas.width / 2 + gap / 2;

  // Team button
  ctx.fillStyle = 'rgba(60, 100, 200, 0.3)';
  ctx.strokeStyle = FINN_COLOR;
  ctx.lineWidth = 3;
  roundRect(teamX, btnY, btnW, btnH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('🤝 TEAM', teamX + btnW / 2, btnY + 50);
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '17px Arial';
  ctx.fillText('Finn + Ford vs', teamX + btnW / 2, btnY + 82);
  ctx.fillText('the cannons', teamX + btnW / 2, btnY + 104);

  // Rivals button
  ctx.fillStyle = 'rgba(180, 60, 60, 0.3)';
  ctx.strokeStyle = '#ff9944';
  ctx.lineWidth = 3;
  roundRect(rivX, btnY, btnW, btnH, 16);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px Arial';
  ctx.fillText('⚔️ RIVALS', rivX + btnW / 2, btnY + 50);
  ctx.fillStyle = '#aaaaaa';
  ctx.font = '17px Arial';
  ctx.fillText('Finn vs Ford —', rivX + btnW / 2, btnY + 82);
  ctx.fillText('last fortress standing!', rivX + btnW / 2, btnY + 104);

  // Save button rects for tap detection
  canvas._teamBtn  = { x: teamX, y: btnY, w: btnW, h: btnH };
  canvas._rivalsBtn = { x: rivX,  y: btnY, w: btnW, h: btnH };
}

// ---- DRAW GAME ----
function drawGame() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Player zone washes
  ctx.fillStyle = FINN_ZONE;
  ctx.fillRect(0, 0, canvas.width / 2, canvas.height);
  ctx.fillStyle = FORD_ZONE;
  ctx.fillRect(canvas.width / 2, 0, canvas.width / 2, canvas.height);

  if (gameMode === 'team') {
    // Dashed center line
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(TEAM_WALL_X, 0);
    ctx.lineTo(TEAM_WALL_X, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    drawWall(sharedWall, TEAM_WALL_X);
    drawRepairHint(sharedWall, TEAM_WALL_X);

    // Labels
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = FINN_COLOR;
    ctx.fillText('FINN', canvas.width * 0.25, 45);
    ctx.fillStyle = FORD_COLOR;
    ctx.fillText('FORD', canvas.width * 0.75, 45);

    // Wave
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('WAVE ' + wave, TEAM_WALL_X, 45);

    // Health bar (center bottom)
    drawHealthBar(canvas.width / 2, canvas.height - 55, sharedHealth, 'FORTRESS HEALTH', '#ffffff');

  } else {
    // Rivals: two walls, two health bars
    drawWall(finnWall, FINN_WALL_X);
    drawWall(fordWall, FORD_WALL_X);
    drawRepairHint(finnWall, FINN_WALL_X);
    drawRepairHint(fordWall, FORD_WALL_X);

    // Player labels
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = FINN_COLOR;
    ctx.fillText('FINN', FINN_WALL_X, 45);
    ctx.fillStyle = FORD_COLOR;
    ctx.fillText('FORD', FORD_WALL_X, 45);

    // Wave (center)
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('WAVE ' + wave, canvas.width / 2, 45);

    // Health bars near each player's wall
    drawHealthBar(FINN_WALL_X, canvas.height - 55, finnHealth, 'FINN\'S FORTRESS', FINN_COLOR);
    drawHealthBar(FORD_WALL_X, canvas.height - 55, fordHealth, 'FORD\'S FORTRESS', FORD_COLOR);
  }

  drawCannonballs();
  drawParticles();

  // Wave clear banner
  if (gamePhase === 'wave-clear') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(canvas.width / 2 - 170, canvas.height / 2 - 55, 340, 110);
    ctx.fillStyle = '#ffff44';
    ctx.font = 'bold 38px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('WAVE CLEAR!', canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = '#fff';
    ctx.font = '22px Arial';
    ctx.fillText('Wave ' + wave + ' incoming...', canvas.width / 2, canvas.height / 2 + 42);
  }

  // Game over screen
  if (gamePhase === 'game-over') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';

    if (gameMode === 'team') {
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 52px Arial';
      ctx.fillText('FORTRESS FALLEN!', canvas.width / 2, canvas.height / 2 - 60);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px Arial';
      ctx.fillText('You survived ' + (wave - 1) + ' wave' + (wave - 1 === 1 ? '' : 's') + '!', canvas.width / 2, canvas.height / 2);
    } else {
      const winColor = rivalWinner === 'finn' ? FINN_COLOR : FORD_COLOR;
      const winName  = rivalWinner === 'finn' ? 'FINN' : 'FORD';
      ctx.fillStyle = winColor;
      ctx.font = 'bold 52px Arial';
      ctx.fillText(winName + ' WINS!', canvas.width / 2, canvas.height / 2 - 60);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('Survived ' + (wave - 1) + ' wave' + (wave - 1 === 1 ? '' : 's'), canvas.width / 2, canvas.height / 2);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '22px Arial';
    ctx.fillText('Tap anywhere to go back to menu', canvas.width / 2, canvas.height / 2 + 60);
  }
}

// ---- MAIN DRAW ----
function draw() {
  if (gamePhase === 'menu') {
    drawMenu();
  } else {
    drawGame();
  }
}

// ---- INPUT ----
function handleInput(tapX, tapY) {
  if (gamePhase === 'menu') {
    // Check which button was tapped
    if (hitRect(tapX, tapY, canvas._teamBtn)) {
      initGame('team');
    } else if (hitRect(tapX, tapY, canvas._rivalsBtn)) {
      initGame('rivals');
    }
    return;
  }

  if (gamePhase === 'game-over') {
    gamePhase = 'menu';
    return;
  }

  tryRepair(tapX, tapY);
}

function hitRect(tx, ty, rect) {
  if (!rect) return false;
  return tx >= rect.x && tx <= rect.x + rect.w && ty >= rect.y && ty <= rect.y + rect.h;
}

// Rounded rectangle helper
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Touch (iPad)
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const rect = canvas.getBoundingClientRect();
    handleInput(touch.clientX - rect.left, touch.clientY - rect.top);
  }
}, { passive: false });

// Click (desktop)
canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  handleInput(e.clientX - rect.left, e.clientY - rect.top);
});

// ---- GAME LOOP ----
function gameLoop(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
  lastTimestamp = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// Start on the menu screen
gamePhase = 'menu';
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
